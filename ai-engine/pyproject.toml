[project]
name = "fieldnode-ai-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "streamlit>=1.40",
  "pydantic>=2.8",
  "mcp>=1.0"
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.17"]
openai = ["langchain-openai>=0.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
